<!doctype html><html data-theme="light" lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HİK-təşkilat</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; img-src 'self' data:">
<style>
:root{
  --bg:#EEF2F3; --surface:#FFFFFF; --surface-2:#F5F8F8; --line:#D3DCDE; --line-strong:#AFBEC1;
  --ink:#15262B; --muted:#5A6D72; --brand:#0E5263; --brand-ink:#FFFFFF; --brand-soft:#DCEBEE;
  --gold:#B07A16; --gold-soft:#FBF1DC; --danger:#B3372B; --danger-soft:#F8E3E0; --ok:#2C7A4B; --ok-soft:#DFF0E6;
  --f-display:"Literata",Georgia,"Times New Roman",serif;
  --f-body:"Noto Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1719; --surface:#142124; --surface-2:#192A2E; --line:#27393D; --line-strong:#3B5358;
  --ink:#E4EEF0; --muted:#93A8AD; --brand:#5FB3C6; --brand-ink:#08262E; --brand-soft:#173840;
  --gold:#E2B256; --gold-soft:#33290F; --danger:#EE8577; --danger-soft:#3A1C18; --ok:#6CC892; --ok-soft:#173326; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1719; --surface:#142124; --surface-2:#192A2E; --line:#27393D; --line-strong:#3B5358;
  --ink:#E4EEF0; --muted:#93A8AD; --brand:#5FB3C6; --brand-ink:#08262E; --brand-soft:#173840;
  --gold:#E2B256; --gold-soft:#33290F; --danger:#EE8577; --danger-soft:#3A1C18; --ok:#6CC892; --ok-soft:#173326; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:14px 8px}
.mark{width:42px;height:42px;border-radius:50%;border:2px solid var(--brand);display:grid;place-items:center;color:var(--brand);font-family:var(--f-display);font-weight:700;font-size:15px;flex:none}
.titles{flex:1;min-width:0}
.titles h1{font-family:var(--f-display);font-size:20px;margin:0;line-height:1.2}
.titles .org{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.periods{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-bottom:8px}
.periods .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-right:2px}
.pchip{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--ink);border-radius:999px;padding:3px 12px;cursor:pointer;font-variant-numeric:tabular-nums}
.pchip:hover{border-color:var(--brand)}
.pchip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.pnow{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.btn{font:inherit;font-weight:600;font-size:14px;border-radius:8px;padding:8px 14px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.08);color:var(--brand-ink)}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn:focus-visible,.tab:focus-visible,.pchip:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,tr[tabindex]:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.tabs{display:flex;flex-wrap:wrap;gap:2px;overflow-x:auto;scrollbar-width:none;margin-bottom:-1px}
.tabs::-webkit-scrollbar{display:none}
.tab{font:inherit;font-size:14px;font-weight:500;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;white-space:nowrap;cursor:pointer;display:flex;gap:6px;align-items:center}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand);font-weight:700}
.tab .n{font-size:11px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:0 7px;font-variant-numeric:tabular-nums;color:var(--muted)}
main{padding-block:22px 60px}
.notice{background:var(--gold-soft);border:1px solid var(--gold);border-radius:var(--r);padding:10px 14px;font-size:14px;margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font-family:var(--f-display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25;margin-top:4px;overflow-wrap:anywhere}
.kpi .s{font-size:13px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand)}
.tbl-wrap{overflow-x:auto}
.split{display:grid;grid-template-columns:350px minmax(0,1fr);gap:20px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card h2{font-family:var(--f-display);font-size:17px;margin:0 0 4px}
.card .hint{font-size:13px;color:var(--muted);margin:0 0 14px}
form.entry{display:grid;gap:12px}
.fld{display:grid;gap:4px;min-width:0}
.fld label{font-size:12.5px;font-weight:600;color:var(--muted)}
.fld input,.fld select,.fld textarea{font:inherit;font-size:15px;width:100%;padding:9px 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink)}
.fld input:focus,.fld select:focus{border-color:var(--brand)}
.fld .help{font-size:12px;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.form-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.form-msg{font-size:13px;min-height:1.2em}
.form-msg.err{color:var(--danger)}
.badge{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--gold);background:var(--gold-soft);border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.reg-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.reg-tools select,.reg-tools input{font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);min-width:0;flex:1 1 180px}
.reg-tools input.srch{flex:0 1 240px;margin-left:auto}
@media (max-width:700px){.reg-tools input.srch{flex:1 1 100%;margin-left:0}}
.sum{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;margin-bottom:8px}
.sum b{color:var(--ink)}
table.reg{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.reg th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
table.reg td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.reg .num{text-align:right;white-space:nowrap}
table.reg tbody tr[data-id]{cursor:pointer}
table.reg tbody tr[data-id]:hover{background:var(--surface-2)}
table.reg tbody tr.sel{background:var(--brand-soft)}
table.reg tr.out td{color:var(--muted)}
.mut{color:var(--muted);font-size:13px}
.st{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap}
.st.pend{background:var(--gold-soft);color:var(--gold)}.st.done{background:var(--ok-soft);color:var(--ok)}.st.rej{background:var(--danger-soft);color:var(--danger)}.st.info{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.empty{padding:32px 12px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:16px;margin-bottom:4px}

.printable{position:relative}
.col>.sheet{max-width:none;margin:0;width:100%}
.printable>h2{padding-right:112px}
.print-btn{position:absolute;top:14px;right:14px;z-index:1;font:inherit;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);color:var(--brand);cursor:pointer}
.print-btn:hover{border-color:var(--brand);background:var(--brand);color:var(--brand-ink)}
.print-btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.print-btn svg{width:16px;height:16px;flex:none}
.print-head{display:none}
@media print{
  :root:not([data-theme="x"]){--bg:#fff;--surface:#fff;--surface-2:#F2F5F5;--line:#C9D3D5;--line-strong:#8FA0A4;--ink:#000;--muted:#4A5A5E;--brand:#0E5263;--brand-ink:#fff;--brand-soft:#E3EEF0;--gold:#8A5E0E;--gold-soft:#FBF1DC;--danger:#B3372B;--ok:#2C7A4B;--ok-soft:#DFF0E6;color-scheme:light}
  .print-btn{display:none!important}
  body.printing #view :is(.card,.sheet,.kpis,.notice):not(.print-target){display:none!important}
  body.printing .split,body.printing .col,body.printing .stack{display:block;max-width:none}
  body.printing .print-target{border:0;box-shadow:none;padding:0;max-width:none;margin:0}
  body.printing .print-target>h2{padding-right:0}
  body.printing .print-target .reg-tools,body.printing .print-target #aCopyBox,body.printing .print-target .form-actions{display:none!important}
  body.printing .print-target>p.mut,body.printing .print-target>.hint{display:none!important}
  body.printing .print-target .tbl-wrap{overflow:visible}
  body.printing .print-target table{font-size:12px}
  body.printing .print-target tr{break-inside:avoid}
  body.printing .print-target thead{display:table-header-group}
  body.printing .print-target tr.sel{background:none}
  body.printing .print-target input{border:0;padding:0;background:none}
  body.printing .print-head{display:block;margin-bottom:10px;font-size:13px;color:var(--muted)}
  body.printing .print-head b{color:var(--ink);font-size:14px}
  @page{size:A4;margin:12mm}
}

.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.stack{display:grid;gap:16px;align-content:start}.stack.narrow{max-width:760px;margin:0 auto}
@media (max-width:900px){.split,.grid2{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){.tabs{flex-wrap:nowrap}.split>section:first-child{order:2}.split{display:flex;flex-direction:column}}
table.st-t td{padding:6px 8px}
td.bar-c{width:38%}.hb{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}.hb i{display:block;height:100%;background:var(--brand);border-radius:0 4px 4px 0}
.scroll-y{max-height:360px;overflow-y:auto}
.nowrap{white-space:nowrap}

.subnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.subtab{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.subtab:hover{border-color:var(--brand)}.subtab[aria-selected="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.subtab .n{font-size:11px;border-radius:999px;padding:0 7px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.top-files{margin-bottom:12px}
.fld.auto input,.fld.auto textarea,.fld.auto select{border-color:var(--ok);background:var(--ok-soft)}
.autob{font-size:10.5px;font-weight:700;color:var(--ok);background:var(--ok-soft);border-radius:4px;padding:0 5px;margin-left:4px;text-transform:uppercase;letter-spacing:.04em}
table.reg tfoot tr.tot td{font-weight:700;background:var(--gold-soft);border-bottom:1px solid var(--gold)}
@media print{table.reg tfoot{display:table-row-group}}
@media print{.subnav{display:none!important}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chips .pchip{font-weight:500}.chips .cnum{font-size:11px;opacity:.75;margin-left:2px}
.body-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 12px;font-size:14px}
.body-meta input{font:inherit;font-size:14px;padding:4px 8px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);color:var(--ink)}
.body-meta .push{flex:1}.body-meta .pdate{display:none}
.from{color:var(--muted);font-style:italic}
.fz{font-size:12.5px;color:var(--gold);margin-top:2px}.fz .btn{margin-left:4px}
@media print{.fz{display:none!important}}
.legend{margin-top:10px}
.chkl{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:600;cursor:pointer}.chkl input{width:17px;height:17px;accent-color:var(--brand)}
.blist{margin:2px 0 0;padding-left:18px;font-size:14px}.blist a{color:var(--brand)}
input.fin{text-transform:uppercase;letter-spacing:.08em}
details.chk{border-top:1px solid var(--line);padding:8px 0}details.chk summary{cursor:pointer;font-size:14px}details.chk ul{margin:8px 0 0;padding-left:20px;font-size:13px;color:var(--muted);max-height:220px;overflow:auto}
details.units{font-size:13px;background:var(--surface-2);border-radius:8px;padding:8px 10px}details.units summary{cursor:pointer;font-weight:600}details.units ul{margin:6px 0 0;padding-left:18px;max-height:200px;overflow:auto}
h3.grp-h{font-family:var(--f-display);font-size:15px;margin:18px 0 6px}

.file{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 8px;align-items:center;padding:4px 6px;border-radius:6px;background:var(--surface-2)}

/* ===== DİZAYN (v2): hər bölmənin öz rəngi, yumşaq fon, rəngli başlıq zolağı. Çapda da rənglər saxlanılır ===== */
/* bölmə rəngləri: --acc-l (açıq rejim), --acc-d (tünd rejim) */
:is([data-sec=report],[data-sec=home],.tab[data-tab=report],.tab[data-tab=home]){--acc-l:#0F7A86;--acc-d:#5CC3CF}
:is([data-sec=ops],[data-sec=orgs],.tab[data-tab=ops],.tab[data-tab=orgs]){--acc-l:#1F68A8;--acc-d:#72B2EA}
:is([data-sec=mem],.tab[data-tab=mem]){--acc-l:#4A55B5;--acc-d:#9CA4F2}
:is([data-sec=sd],[data-sec=bodies],.tab[data-tab=sd],.tab[data-tab=bodies]){--acc-l:#7A4CAE;--acc-d:#C39DEB}
:is([data-sec=aid],[data-sec=prots],.tab[data-tab=aid],.tab[data-tab=prots]){--acc-l:#AE456B;--acc-d:#EF95B5}
:is([data-sec=bk],[data-sec=contracts],.tab[data-tab=bk],.tab[data-tab=contracts]){--acc-l:#A1621C;--acc-d:#E9B46A}
:is([data-sec=letters],[data-sec=events],.tab[data-tab=letters],.tab[data-tab=events]){--acc-l:#2E7A4E;--acc-d:#82D09F}
:is([data-sec=plan],.tab[data-tab=plan]){--acc-l:#5D7A22;--acc-d:#B7D27C}
:is([data-sec=settings],.tab[data-tab=settings]){--acc-l:#506577;--acc-d:#A8BAC8}
